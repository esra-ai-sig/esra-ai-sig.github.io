# ============================================================
# OPPORTUNITIES  (calls for papers, submission deadlines, awards)
# ------------------------------------------------------------
# Chairs: add an opportunity by copying a block below and editing it.
#
# Fields:
#   type      : always "opportunity"  (drives the Latest feed + badge)
#   kind      : call for papers | award | funding | participation
#   title     : opportunity title
#   date      : YYYY-MM-DD deadline or key date
#   status    : open | closed
#   link      : URL to the call or opportunity
#   source    : optional source label
#   tags      : optional comma-separated keywords
#   note      : one-line description
# ============================================================

